groups:
- name: dell-initial-infra
  rules:
  - alert: GuestExporterUnavailable
    expr: up{job="guest-node"} == 0
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: 'Guest exporter unavailable: {{ $labels.role }}'
      description: Check guest/network/exporter. This is not proof of business failure.
  - alert: HttpHealthUnavailable
    expr: probe_success{job="http-health"} == 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: 'HTTP probe failed: {{ $labels.check }}'
  - alert: GuestMemoryAvailableLow
    expr: node_memory_MemAvailable_bytes{job="guest-node"} / node_memory_MemTotal_bytes{job="guest-node"}
      < 0.10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: 'Guest available memory below initial 10% threshold: {{ $labels.role
        }}'
  - alert: GuestFilesystemSpaceLow
    expr: node_filesystem_avail_bytes{job="guest-node",fstype!~"tmpfs|overlay|squashfs|ramfs"}
      / node_filesystem_size_bytes{job="guest-node",fstype!~"tmpfs|overlay|squashfs|ramfs"}
      < 0.20
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: 'Guest filesystem free space below initial 20% threshold: {{ $labels.role
        }} {{ $labels.mountpoint }}'
  - alert: PveCollectorStale
    expr: time() - dell_pve_collector_timestamp_seconds > 180
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: PVE metadata collector has stopped updating
  - alert: PveRaidDegraded
    expr: dell_pve_raid_virtual_optimal == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: PVE RAID virtual disk is not optimal
  - alert: PveRaidMemberOffline
    expr: dell_pve_raid_member_online == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: PVE RAID physical member is not online
  - alert: PveStorageSpaceLow
    expr: dell_pve_storage_avail_bytes / dell_pve_storage_total_bytes < 0.20
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: PVE storage available space below 20%
  - alert: PveMemoryAvailableLow
    expr: dell_pve_memory_available_bytes / dell_pve_memory_total_bytes < 0.10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: PVE available memory below initial 10% threshold
  - alert: CloudflareProcessUnavailable
    expr: dell_cf_cloudflared_active == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Existing Cloudflare tunnel process is inactive
  - alert: GuestManagedUnitUnavailable
    expr: dell_guest_service_present == 1 and dell_guest_service_active == 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: A configured guest service is inactive
  - alert: GuestLocalHealthUnavailable
    expr: dell_guest_http_up == 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: A configured local application health check failed
