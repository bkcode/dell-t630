global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    site: dell-t630
    monitor: ops-service
rule_files:
- /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
    labels:
      role: ops-service
- job_name: blackbox-exporter
  static_configs:
  - targets:
    - blackbox:9115
    labels:
      role: ops-service
- job_name: guest-node
  file_sd_configs:
  - files:
    - /etc/prometheus/targets/guest-node.json
  scrape_timeout: 10s
- job_name: http-health
  metrics_path: /probe
  params:
    module:
    - http_2xx
  file_sd_configs:
  - files:
    - /etc/prometheus/targets/http-services.json
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: blackbox:9115
