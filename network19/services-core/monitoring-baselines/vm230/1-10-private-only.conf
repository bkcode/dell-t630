[Service]
User=prometheus
Group=prometheus
ExecCondition=/usr/bin/python3 /opt/dell/guest-monitoring/install-guest-baseline.py --check-private-ip --role java-prod-01
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=10.63.10.20:9100 --collector.textfile.directory=/var/lib/prometheus/node-exporter-textfile
NoNewPrivileges=yes
MemoryMax=128M
CPUQuota=20%
