name: dell-nas
services:
  jellyfin:
    image: ${JELLYFIN_IMAGE:?A verified amd64 digest is required}
    user: ${JELLYFIN_UID:?}:${JELLYFIN_GID:?}
    # systemd owns restart ordering; Docker must not restart before the data mount.
    restart: "no"
    cpus: 2
    mem_limit: 1536m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NAS_BIND_IP:?}:8096:8096/tcp"
    environment:
      TZ: Asia/Shanghai
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLIC_URL:?}
    volumes:
      - type: bind
        source: ${NAS_MOUNT:?}/appdata/jellyfin/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${NAS_MOUNT:?}/appdata/jellyfin/cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${NAS_MOUNT:?}/media
        target: /media
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
