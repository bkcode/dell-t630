# Password prefill is a shared-login convenience for trusted LAN/VPN clients.
location = /js/selfhost-login.json {
    # Never trust a remote proxy header to turn an unapproved peer into LAN.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.21.0/24;
    allow 10.66.66.0/24;
    allow 192.168.19.50;
    deny all;
    limit_except GET { deny all; }
    alias /run/secrets/login-defaults;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
}
