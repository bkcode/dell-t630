# PREPARED ONLY; install after manager-approved VM250 change window.
[Unit]
StartLimitIntervalSec=900
StartLimitBurst=3

[Service]
Type=notify
NotifyAccess=main
RemainAfterExit=no
ExecStart=
ExecStart=/usr/bin/python3 -I -B /opt/dell/penpot/runtime/health-supervision/supervisor.py supervise
ExecStop=
ExecStopPost=/usr/bin/python3 -I -B /opt/dell/penpot/runtime/health-supervision/supervisor.py stop
Restart=on-failure
RestartSec=30
TimeoutStartSec=600
TimeoutStopSec=180
KillMode=control-group
